<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>顔と体の輪郭 v1.3.0</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: white; color: #172033; font-family: sans-serif; }
    #app { height: 100%; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
    #version { white-space: nowrap; font-weight: bold; }
    #stage { position: relative; min-height: 0; min-width: 0; overflow: hidden; background: #141e32; border: 3px solid white; outline: 1px solid #d8dce3; }
    #stage canvas { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; }
    footer { display: flex; align-items: center; gap: 12px; }
    button { flex-shrink: 0; border: 0; border-radius: 8px; padding: 12px 16px; background: #20324f; color: white; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .6; }
    #status { font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    #status p { margin: 0; }
    @media (max-height: 450px) { #app { gap: 4px; } button { padding: 8px 12px; } header, #status { font-size: 11px; } }
  </style>
</head>
<body>
  <div id="app">
    <header><span>顔と体の輪郭 <span style="color:#c65c00">● 体</span></span><span id="version">v1.3.0</span></header>
    <main id="stage" aria-label="顔と体の輪郭を重ねたカメラ映像"></main>
    <footer>
      <button id="camera-button" type="button" disabled>読み込み中…</button>
      <div id="status" role="status">
        <p id="camera-status">ライブラリを読み込んでいます。</p>
        <p id="face-status">顔：待機中</p>
        <p id="body-status">体：待機中</p>
      </div>
    </footer>
  </div>
  <script>
    window.libraryError = function (name) {
      document.getElementById('camera-status').textContent = name + 'を読み込めません。通信を確認して再読み込みしてください。';
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js" onerror="libraryError('p5.js')"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/ml5@1.2.1/dist/ml5.min.js" onerror="libraryError('顔認識ライブラリ')"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js" onerror="libraryError('体認識ライブラリ')"></script>
  <script defer src="sketch.js?v=1.3.0" onerror="libraryError('描画コード')"></script>
</body>
</html>
