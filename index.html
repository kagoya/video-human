<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>顔と体の輪郭を検出</title>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ml5@1.2.1/dist/ml5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js"></script>

    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141e32;
        color: white;
        font-family: sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        height: 100%;
        height: 100dvh;
      }
      #stage canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }
      #controls {
        position: fixed;
        z-index: 1;
        left: max(16px, env(safe-area-inset-left));
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        pointer-events: none;
      }
      #controls button {
        pointer-events: auto;
        padding: 12px 20px;
        font-size: 16px;
        border: 0;
        border-radius: 10px;
        color: white;
        background: #202b40;
      }
      #controls p {
        width: fit-content;
        max-width: 100%;
        margin: 8px 0 0;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <main id="stage" aria-label="顔と体の輪郭を重ねたカメラ映像"></main>
    <div id="controls"></div>
    <script src="sketch.js"></script>
  </body>
</html>
