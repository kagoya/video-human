<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <title>Mini Piano</title>
  <link rel="stylesheet" href="style.css">
  <script src="piano.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Mini Piano ホーム">
        <span class="brand-icon" aria-hidden="true">♫</span>
        <span>mini piano</span>
      </a>
      <span class="sound-indicator"><span aria-hidden="true"></span> SOUND ON</span>
    </header>

    <section class="instrument" aria-labelledby="title">
      <div class="intro">
        <p class="eyebrow">YOUR LITTLE MUSIC STUDIO</p>
        <h1 id="title">気軽に、ピアノを。</h1>
        <p class="description">鍵盤をタップするか、キーボードで演奏してみましょう。</p>
      </div>

      <div class="piano" role="group" aria-label="ピアノの鍵盤">
        <div class="keys">
          <button class="key white" type="button" data-note="C4" data-frequency="261.63" data-key="a" aria-label="ド、キーボード A"><span class="key-hint">A</span></button>
          <button class="key white" type="button" data-note="D4" data-frequency="293.66" data-key="s" aria-label="レ、キーボード S"><span class="key-hint">S</span></button>
          <button class="key white" type="button" data-note="E4" data-frequency="329.63" data-key="d" aria-label="ミ、キーボード D"><span class="key-hint">D</span></button>
          <button class="key white" type="button" data-note="F4" data-frequency="349.23" data-key="f" aria-label="ファ、キーボード F"><span class="key-hint">F</span></button>
          <button class="key white" type="button" data-note="G4" data-frequency="392.00" data-key="g" aria-label="ソ、キーボード G"><span class="key-hint">G</span></button>
          <button class="key white" type="button" data-note="A4" data-frequency="440.00" data-key="h" aria-label="ラ、キーボード H"><span class="key-hint">H</span></button>
          <button class="key white" type="button" data-note="B4" data-frequency="493.88" data-key="j" aria-label="シ、キーボード J"><span class="key-hint">J</span></button>
          <button class="key white" type="button" data-note="C5" data-frequency="523.25" data-key="k" aria-label="高いド、キーボード K"><span class="key-hint">K</span></button>
          <button class="key black" type="button" data-note="C#4" data-frequency="277.18" data-key="w" style="--position: 1" aria-label="ドのシャープ、キーボード W"><span class="key-hint">W</span></button>
          <button class="key black" type="button" data-note="D#4" data-frequency="311.13" data-key="e" style="--position: 2" aria-label="レのシャープ、キーボード E"><span class="key-hint">E</span></button>
          <button class="key black" type="button" data-note="F#4" data-frequency="369.99" data-key="t" style="--position: 4" aria-label="ファのシャープ、キーボード T"><span class="key-hint">T</span></button>
          <button class="key black" type="button" data-note="G#4" data-frequency="415.30" data-key="y" style="--position: 5" aria-label="ソのシャープ、キーボード Y"><span class="key-hint">Y</span></button>
          <button class="key black" type="button" data-note="A#4" data-frequency="466.16" data-key="u" style="--position: 6" aria-label="ラのシャープ、キーボード U"><span class="key-hint">U</span></button>
        </div>
        <div class="keyboard-guide" aria-hidden="true">
          <span>PC キーボードでも演奏できます</span>
          <span class="guide-keys">A 〜 K <span>＋</span> W E T Y U</span>
        </div>
      </div>
      <p class="note" role="status" aria-live="polite">鍵盤を押して音を鳴らしましょう</p>
    </section>

    <footer>音声はお使いのブラウザ内で生成されます。</footer>
  </main>
</body>
</html>
